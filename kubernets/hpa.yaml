apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: shop-service-hpa
  namespace: bloomworld

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shop-service

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70