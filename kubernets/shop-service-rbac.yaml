apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-service-reader
  namespace: bloomworld
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-service-reader-binding
  namespace: bloomworld
subjects:
  - kind: ServiceAccount
    name: shop-service-ksa
    namespace: bloomworld
roleRef:
  kind: Role
  name: shop-service-reader
  apiGroup: rbac.authorization.k8s.io