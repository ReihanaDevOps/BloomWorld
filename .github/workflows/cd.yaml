name: BloomWorld CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}


      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}


      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./shop-service
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/shop-service:${{ github.sha }}
            asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/shop-service:latest


      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: bloomworld-gke
          location: asia-south1
          project_id: ${{ vars.GCP_PROJECT_ID }}


      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f kubernets/namespace.yaml
          kubectl apply -f kubernets/serviceaccount.yaml
          kubectl apply -f kubernets/service.yaml
          kubectl apply -f kubernets/gateway.yaml
          kubectl apply -f kubernets/httproute.yaml
          kubectl apply -f kubernets/hpa.yaml

          IMAGE="asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/shop-service:${{ github.sha }}"

          sed "s|IMAGE_URL|$IMAGE|g" kubernets/deployment.yaml | kubectl apply -f -